<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uso e custo · Admin · Asimov Prisma</title>
  <meta name="description" content="Consumo e custo real do período.">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/prisma-favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/motion.css">
</head>
<body>

  <div class="app" data-page="admin-uso" data-nav="admin" data-title="Uso e custo">
    <main class="main" id="conteudo" tabindex="-1">
      <div class="page page--wide">
        <header class="page-head"><div class="page-head__text"><h1 class="page-title">Uso e custo</h1><p class="page-sub">Consumo e custo real do período, em R$, créditos e tokens.</p></div></header>
        <form class="card period" data-filters novalidate aria-label="Período">
          <div class="field" style="margin:0"><label class="sr-only" for="u-from">De</label><input id="u-from" class="input" type="date" value="2026-09-30" aria-label="Data inicial"></div>
          <span class="period__sep">até</span>
          <div class="field" style="margin:0"><label class="sr-only" for="u-to">Até</label><input id="u-to" class="input" type="date" value="2026-10-06" aria-label="Data final"></div>
          <div class="seg seg--sm" role="group" aria-label="Atalhos de período" data-range><button type="button" class="seg__btn" data-d="7" aria-pressed="true">7 dias</button><button type="button" class="seg__btn" data-d="30" aria-pressed="false">30 dias</button></div>
          <label class="sr-only" for="u-group">Agrupar por</label>
          <select id="u-group" class="select select--sm" style="width:auto"><option>Agrupar por dia</option><option>Agrupar por usuário</option><option>Agrupar por modelo</option></select>
          <span class="toolbar__spacer"></span>
          <button type="submit" class="btn btn--primary btn--sm" data-apply>Aplicar</button>
        </form>
        <p class="hint" data-period-note style="margin:0 0 20px 4px"></p>
        <div data-body></div>
      </div>
    </main>
  </div>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pages/admin-usage.js"></script>
</body>
</html>
