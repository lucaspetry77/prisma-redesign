<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galeria · Asimov Prisma</title>
  <meta name="description" content="Agentes e skills prontos, da Asimov e da comunidade.">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/prisma-favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/motion.css">
</head>
<body>

  <div class="app" data-page="galeria" data-nav="galeria" data-screen-title="Galeria">
    <main class="main" id="conteudo" tabindex="-1">
      <div class="page page--wide">
        <header class="page-head">
          <div class="page-head__text">
            <h1 class="page-title">Galeria</h1>
            <p class="page-sub">Agentes e skills prontos, feitos pela Asimov e pela comunidade. Converse com um agente na hora ou copie uma skill para adaptar.</p>
          </div>
        </header>
        <div class="tabs mb-5" role="tablist" aria-label="Visão" data-view>
          <button type="button" role="tab" class="tabs__btn" aria-selected="true" data-v="explorar">Explorar</button>
          <button type="button" role="tab" class="tabs__btn" aria-selected="false" tabindex="-1" data-v="favoritos">Meus favoritos <span class="count" data-fav-count></span></button>
        </div>
        <div class="gallery-bar">
          <div class="seg" role="tablist" aria-label="Tipo" data-type>
            <button type="button" role="tab" class="seg__btn" aria-selected="true" data-t="agents"><i class="i " data-icon="agent"></i>Agentes</button>
            <button type="button" role="tab" class="seg__btn" aria-selected="false" tabindex="-1" data-t="skills"><i class="i " data-icon="skill"></i>Skills</button>
          </div>
          <div class="row gallery-bar__filters">
            <div class="input-icon gallery-bar__search" role="search"><i class="i " data-icon="search"></i><label class="sr-only" for="g-q">Buscar na galeria</label><input id="g-q" class="input" type="search" placeholder="Buscar por nome ou assunto" autocomplete="off" data-search></div>
            <label class="sr-only" for="g-origin">Origem</label>
            <select id="g-origin" class="select w-auto"><option value="">Todas as origens</option><option value="oficial">Oficiais da Asimov</option><option value="comunidade">Da comunidade</option></select>
            <label class="sr-only" for="g-order">Ordenar</label>
            <select id="g-order" class="select w-auto"><option value="recentes">Mais recentes</option><option value="avaliados">Melhor avaliados</option><option value="nome">Nome (A–Z)</option></select>
          </div>
        </div>
        <div class="gallery-filters"><div class="chips" role="group" aria-label="Categoria" data-cats></div></div>
        <div class="row row--between mb-3"><p class="featured-label" data-featured><i class="i i--sm" data-icon="verified"></i>Oficiais da Asimov</p><span class="toolbar__count" data-count aria-live="polite"></span></div>
        <div data-grid></div>
      </div>
    </main>
  </div>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pages/gallery.js"></script>
</body>
</html>
